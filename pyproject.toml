[project]
name = "homeservice"
version = "0.1.0"
description = "Сервис для домашних услуг на базе Wagtail CMS"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "wagtail>=7.3.1",
    "wagtail-localize>=1.13",
    "django-bootstrap5>=26.2",
    "django-compressor>=4.5.1",
    "gunicorn>=25.3.0",
    "django-redis>=6.0.0",
    "redis>=5.3.1",
    "wagtail-cache>=3.0.0",
    "psycopg[binary]>=3.2.4",
    "django-tasks-db>=0.12.0",
]

[dependency-groups]
dev = [
    "django-browser-reload==1.21.0",
    "django-debug-toolbar>=5.0.1",
    "pre-commit>=4.6.0",
    "ruff>=0.15.16",
]

[tool.ruff]
# Ruff documentation: https://docs.astral.sh/ruff/
# Configuration: https://docs.astral.sh/ruff/configuration/
# Rules: https://docs.astral.sh/ruff/rules/
target-version = "py312"
line-length = 120
exclude = [
    "**/migrations/*.py",
    ".git",
    ".venv",
    "media",
    "static",
    "staticfiles",
    ".idea",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django
    "T10",    # flake8-debugger
    "T20",    # flake8-print
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "DJ001",  # avoid null=True on string-based fields (will require migrations)
    "DJ012",  # order of model's inner classes/methods (style guide)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["cms", "search", "server", "settings"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.extend-per-file-ignores]
"settings/*.py" = ["F403", "F405"]
"**/__init__.py" = ["F401"]
"manage.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
