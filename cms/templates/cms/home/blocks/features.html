<section class="py-5 bg-white" id="{{ value.anchor|default:'features' }}">
    <div class="container py-4">
        <h2 class="text-center fw-bold mb-5 fs-1">{{ value.title }}</h2>
        <div class="row g-4 justify-content-center">
            {% for item in value.items %}
                <div class="col-md-4">
                    <div class="p-4 rounded-4 shadow-sm bg-light h-100 text-center">
                        <div class="text-primary mb-3">
                            <i class="bi bi-check-circle-fill fs-2"></i>
                        </div>
                        <h3 class="h4 fw-bold mb-3">{{ item.title }}</h3>
                        <p class="text-muted mb-0">{{ item.text }}</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
