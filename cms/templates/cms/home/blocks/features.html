{% extends "blocks/base_block_wrapper.html" %}

{% block block_content %}
    <h2 class="text-center fw-bold mb-5 fs-1">{{ self.title }}</h2>
    <div class="row g-4 justify-content-center">
        {% for item in self.items %}
            <div class="col-md-4">
                <div class="p-4 rounded-4 shadow-sm bg-body-secondary h-100 text-center">
                    <div class="text-primary mb-3">
                        <i class="bi bi-check-circle-fill fs-2"></i>
                    </div>
                    <h3 class="h4 fw-bold mb-3">{{ item.title }}</h3>
                    <p class="text-body-secondary mb-0">{{ item.text }}</p>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
