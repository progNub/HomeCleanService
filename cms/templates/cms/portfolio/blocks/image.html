{% extends "blocks/base_block_wrapper.html" %}
{% load wagtailimages_tags %}

{% block block_content %}
    <div class="portfolio-step-image-container zoom-container rounded shadow-sm mx-auto overflow-hidden">
        {% image self.image max-1000x800 format-webp class="img-fluid w-100 h-100" %}
    </div>
    {% if self.caption %}
        <div class="text-center mt-3 text-muted small">
            {{ self.caption }}
        </div>
    {% endif %}
{% endblock %}
