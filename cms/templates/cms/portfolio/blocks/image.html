{% load wagtailimages_tags %}

<div class="portfolio-block portfolio-image-block my-5">
    <div class="portfolio-step-image-container zoom-container rounded shadow-sm mx-auto overflow-hidden">
        {% image self.image max-1000x800 class="img-fluid w-100 h-100" %}
    </div>
    {% if self.caption %}
        <div class="text-center mt-3 text-muted small">
            {{ self.caption }}
        </div>
    {% endif %}
</div>
