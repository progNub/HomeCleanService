{% load wagtailcore_tags i18n %}

{% if self and not self.is_root and self.depth > 2 %}
    <nav aria-label="breadcrumb" class="bg-light py-2 mb-4 border-bottom">
        <div class="container">
            <ol class="breadcrumb mb-0">
                {% for page in self.get_ancestors %}
                    {% if not page.is_root %}
                        <li class="breadcrumb-item">
                            <a href="{% pageurl page %}" class="text-decoration-none">{{ page.title }}</a>
                        </li>
                    {% endif %}
                {% endfor %}
                <li class="breadcrumb-item active" aria-current="page">{{ self.title }}</li>
            </ol>
        </div>
    </nav>
{% endif %}
