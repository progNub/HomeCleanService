name: Checks and manual production release

on:
  pull_request:
  push:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the tested image and deploy production (master only)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: homeservice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: homeservice_test
          POSTGRES_USER: homeservice_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homeservice_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: settings.test
      DJANGO_LOAD_DOTENV: "0"
      TEST_POSTGRES: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: homeservice_test
      DB_USER: homeservice_test
      DB_PASSWORD: ci-test-only
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.9.26
          uv sync --locked
          npm ci
          npm run build
      - name: Validate and test
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync python manage.py check
          uv run --no-sync python manage.py makemigrations --check --dry-run
          uv run --no-sync python manage.py test cms.tests
          uv run --no-sync python -m unittest discover -s tests -v
          bash -n deploy/scripts/*.sh deploy/certbot/cert-manage.sh deploy/nginx/entrypoint/entrypoint.sh

  image:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build application and verify bundled runtime
        run: |
          IMAGE_TAG="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          docker build --build-arg "RELEASE_REVISION=$GITHUB_SHA" --tag "$IMAGE_TAG" .
          docker run --rm --entrypoint python "$IMAGE_TAG" manage.py test cms.tests --settings=settings.test
          docker run --rm --entrypoint sh "$IMAGE_TAG" -ec 'test ! -e /app/.env; test ! -d /app/.git; test -s /opt/homeservice/static/staticfiles.json; ! command -v node'
          HOMESERVICE_TEST_IMAGE="$IMAGE_TAG" bash tests/container-smoke.sh
      - name: Publish tested image (explicit manual release only)
        id: publish
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/master'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_TAG"
          IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Deploy verified revision and image
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE_REVISION: ${{ github.sha }}
          APP_IMAGE: ${{ needs.image.outputs.image }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: DEPLOY_PATH,RELEASE_REVISION,APP_IMAGE
          command_timeout: 15m
          script: |
            set -eu
            test -n "$DEPLOY_PATH"
            cd -- "$DEPLOY_PATH"
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin master
            git merge-base --is-ancestor "$RELEASE_REVISION" origin/master
            git checkout --detach "$RELEASE_REVISION"
            bash deploy/scripts/release.sh
