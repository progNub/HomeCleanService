# pre-commit documentation: https://pre-commit.com/
# List of available hooks: https://pre-commit.com/hooks.html
exclude: '(?x)^(
    .*/migrations/.*|
    \.venv/.*|
    media/.*|
    static/.*|
    \.idea/.*|
    )$'

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-toml        # check syntax pyproject.toml
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: debug-statements  # catching left print() and breakpoint()

-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff hook documentation: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.16
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
