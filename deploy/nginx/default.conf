# Rate limit zone: 10MB shared memory, allows 20 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml;

# =========================================================================
# REDIRECT HTTP TO HTTPS
# =========================================================================
server {
    listen 80;
    server_name homecleanservice.by www.homecleanservice.by stats.homecleanservice.by logs.homecleanservice.by;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect IP directly to main domain (HTTPS)
server {
    listen 80;
    server_name 153.80.244.26;
    return 301 https://homecleanservice.by$request_uri;
}

# =========================================================================
# 1. DJANGO / WAGTAIL (HTTPS)
# =========================================================================
server {
    listen 443 ssl;
    server_name homecleanservice.by www.homecleanservice.by;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /run/homeservice-tls/fullchain.pem;
    ssl_certificate_key /run/homeservice-tls/privkey.pem;

    # SSL optimizations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    client_max_body_size 20M;
    limit_req zone=api_limit burst=50 nodelay;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    # Inspect reports and configured CMS analytics before strict enforcement.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://stats.homecleanservice.by; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://stats.homecleanservice.by; frame-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Favicon
    location = /favicon.ico {
        alias /app/staticfiles/cms/images/logo/favicon.ico;
        expires 30d;
        access_log off;
    }

    # Django/Wagtail static files
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Media files (uploads)
    location /media/ {
        alias /app/media/;
        expires 1d;
    }

    location ~ ^/(admin|django-admin)/login/ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # Proxying to Gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }
}

# =========================================================================
# 2. UMAMI ANALYTICS (HTTPS)
# =========================================================================
server {
    listen 443 ssl;
    server_name stats.homecleanservice.by;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /run/homeservice-tls/fullchain.pem;
    ssl_certificate_key /run/homeservice-tls/privkey.pem;

    client_max_body_size 5M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Proxying to Umami
    location / {
        proxy_pass http://umami:3000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
}

# =========================================================================
# 3. DOZZLE LOG VIEWER (HTTPS)
# =========================================================================
server {
    listen 443 ssl;
    server_name logs.homecleanservice.by;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /run/homeservice-tls/fullchain.pem;
    ssl_certificate_key /run/homeservice-tls/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Logs are available only through a loopback SSH tunnel (port 8081).
    location / {
        return 404;
    }
}
