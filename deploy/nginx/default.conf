# Rate limit zone: 10MB shared memory, allows 5 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# =========================================================================
# 1. DJANGO / WAGTAIL
# =========================================================================
server {
    listen 80;
    # TODO: Replace 'localhost' with your actual domain (e.g., homeservice.by)
    server_name localhost;

    client_max_body_size 20M;

    # Rate limiting for all requests, allowing bursts of 20 requests
    limit_req zone=api_limit burst=20 nodelay;

    # Django/Wagtail static files
    location /static/ {
        alias /app/staticfiles/;
    }

    # Media files (uploads)
    location /media/ {
        alias /app/media/;
    }

    # Proxying to Gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }
}

# =========================================================================
# 2. UMAMI ANALYTICS
# =========================================================================
server {
    listen 80;
    server_name stats.localhost;
    client_max_body_size 5M;

    location / {
        proxy_pass http://umami:3000; # No trailing slash, proxying the entire root
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;

        # Important headers for WebSockets and real IP in Umami
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
    }
}
