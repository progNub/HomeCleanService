# Rate limit zone: 10MB shared memory, allows 5 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;
    # TODO: Replace 'localhost' with your actual domain (e.g., homeservice.by)
    server_name localhost;

    client_max_body_size 20M;

    # Rate limiting for all requests, allowing bursts of 10 requests
    limit_req zone=api_limit burst=10 nodelay;

    # Django/Wagtail static files
    location /static/ {
        alias /app/staticfiles/;
    }

    # Media files (uploads)
    location /media/ {
        alias /app/media/;
    }

    # Proxying to Gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }
}
