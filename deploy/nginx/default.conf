# Rate limit zone: 10MB shared memory, allows 20 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# =========================================================================
# 1. DJANGO / WAGTAIL
# =========================================================================
server {
    listen 80;
    # The domain names for the main site
    server_name homecleanservice.by www.homecleanservice.by;

    client_max_body_size 20M;

    # Rate limiting for all requests, allowing bursts of 50 requests
    limit_req zone=api_limit burst=50 nodelay;

    # =========================================================================
    # SECURITY HEADERS
    # =========================================================================
    # Prevent clickjacking by forbidding framing the site
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Block XSS attacks in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Prevent MIME-type sniffing (protects against malicious file uploads)
    add_header X-Content-Type-Options "nosniff" always;

    # Control how much referrer information is shared with other sites
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Content Security Policy: Restricts sources of scripts/styles/images to 'self' and trusted origins
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Strict-Transport-Security (HSTS): Forces browsers to use HTTPS for the next year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # =========================================================================

    # Django/Wagtail static files
    location /static/ {
        alias /app/staticfiles/;
    }

    # Media files (uploads)
    location /media/ {
        alias /app/media/;
    }

    # Proxying to Gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }
}

# =========================================================================
# 2. UMAMI ANALYTICS
# =========================================================================
server {
    listen 80;
    server_name stats.homecleanservice.by;
    client_max_body_size 5M;

    # =========================================================================
    # SECURITY HEADERS
    # =========================================================================
    # Prevent clickjacking by forbidding framing the site
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Block XSS attacks in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Prevent MIME-type sniffing (protects against malicious file uploads)
    add_header X-Content-Type-Options "nosniff" always;

    # Control how much referrer information is shared with other sites
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Content Security Policy for Umami
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    # Strict-Transport-Security (HSTS): Forces browsers to use HTTPS for the next year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # =========================================================================

    # Proxying to Umami
    location / {
        proxy_pass http://umami:3000; # No trailing slash, proxying the entire root
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;

        # Important headers for WebSockets and real IP in Umami
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
    }
}
