services:
  db:
    image: postgres:16-alpine
    container_name: homeservice_db_dev
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-homeservice}
      - POSTGRES_USER=${DB_USER:-homeservice_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-homeservice_pass}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/

  redis:
    image: redis:alpine
    container_name: homeservice_redis_dev
    restart: always
    ports:
      - "6380:6379"

volumes:
  postgres_data_dev:
