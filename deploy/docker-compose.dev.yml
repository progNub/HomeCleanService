services:
  db:
    image: postgres:16-alpine
    container_name: homeservice_db_dev
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-homeservice}
      - POSTGRES_USER=${DB_USER:-homeservice_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-homeservice_pass}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
      - ./umami/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - default
  redis:
    image: redis:alpine
    container_name: homeservice_redis_dev
    restart: always
    ports:
      - "6380:6379"
    networks:
      - default

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: homeservice_umami_dev
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-homeservice_user}:${DB_PASSWORD:-homeservice_pass}@db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:-replace-with-a-random-string}
      - TRACKER_SCRIPT_NAME=stats
    depends_on:
      - db
    expose:
      - "3000"
    networks:
      - default

networks:
  default:
    name: homeservice_dev_network

volumes:
  postgres_data_dev:
