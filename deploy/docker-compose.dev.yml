services:
  db:
    image: postgres:16-alpine
    container_name: homeservice_db_dev
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-homeservice}
      - POSTGRES_USER=${DB_USER:-homeservice_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-homeservice_pass}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
      - ./umami/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - default
  redis:
    image: redis:alpine
    container_name: homeservice_redis_dev
    restart: always
    ports:
      - "6380:6379"
    networks:
      - default

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: homeservice_worker_dev
    restart: always
    volumes:
      - ..:/app
    entrypoint: /app/deploy/worker-entrypoint.sh
    command: python manage.py db_worker --queue-name default,notifications
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - redis
      - db
    networks:
      - default

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: homeservice_umami_dev
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-homeservice_user}:${DB_PASSWORD:-homeservice_pass}@db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:-replace-with-a-random-string}
      - TRACKER_SCRIPT_NAME=stats
    depends_on:
      - db
    ports:
      - "3000:3000"
    networks:
      - default

  dozzle:
    image: amir20/dozzle:v10.6.3
    container_name: homeservice_dozzle_dev
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data_dev:/data
    secrets:
      - source: dozzle_users
        target: /data/users.yml
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
    env_file:
      - ../.env
    ports:
      - "8081:8080"
    networks:
      - default

networks:
  default:
    name: homeservice_dev_network

secrets:
  dozzle_users:
    file: ./dozzle/users.yml

volumes:
  postgres_data_dev:
  dozzle_data_dev:
