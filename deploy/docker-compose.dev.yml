name: ${COMPOSE_PROJECT_NAME:-homeservice-dev}

services:
  db:
    container_name: homeservice_db_dev
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-homeservice_pass}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
  redis:
    container_name: homeservice_redis_dev
    ports:
      - "127.0.0.1:6380:6379"

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    container_name: homeservice_worker_dev
    restart: unless-stopped
    volumes:
      - ..:/app
    entrypoint: /app/deploy/worker-entrypoint.sh
    command: python manage.py db_worker --queue-name default,notifications
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=settings.dev_worker
      - DJANGO_LOAD_DOTENV=0
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      redis: {condition: service_healthy}
      db: {condition: service_healthy}

  umami:
    container_name: homeservice_umami_dev
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-homeservice_user}:${DB_PASSWORD:-homeservice_pass}@db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET:-replace-with-a-random-string}
    ports:
      - "127.0.0.1:3000:3000"

  dozzle:
    container_name: homeservice_dozzle_dev
    volumes:
      - dozzle_data_dev:/data

networks:
  default:
    name: homeservice_dev_network

volumes:
  # Preserve both existing volume names and Compose ownership labels.
  postgres_data_dev:
  dozzle_data_dev:
