# Production overrides; combine with docker-compose.yml.
name: ${COMPOSE_PROJECT_NAME:-homeservice-prod}

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE must identify the built release image}
  env_file: ["${HOMESERVICE_ENV_FILE:-../.env}"]
  environment:
    DJANGO_SETTINGS_MODULE: settings.production
    DJANGO_LOAD_DOTENV: "0"
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
  networks: [homeservice_network]
  logging: *logging
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  web:
    <<: *app
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.parse,urllib.request; request=urllib.request.Request('http://localhost:8000/ready/', headers={'Host': urllib.parse.urlsplit(os.environ['SITE_URL']).netloc}); urllib.request.urlopen(request, timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 4
    volumes: ["../media:/app/media"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    restart: unless-stopped
    entrypoint: /app/deploy/worker-entrypoint.sh
    command: python manage.py db_worker --queue-name default,notifications
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  release:
    <<: *app
    profiles: [release]
    restart: "no"
    entrypoint: /app/deploy/release-entrypoint.sh
    volumes:
      - ../media:/app/media
      - ../staticfiles:/app/staticfiles
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  db:
    networks: [homeservice_network]
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

  redis:
    networks: [homeservice_network]

  dozzle:
    networks: [homeservice_network]

  umami:
    networks: [homeservice_network]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-homeservice_user}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required}

  nginx:
    image: nginx@sha256:5aca99593157f4ae539a5dec1092a0ad8762f8e2eb1789085a13a0f5622369f6
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    depends_on:
      web: {condition: service_healthy}
      umami: {condition: service_started}
    networks: [homeservice_network]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/entrypoint/entrypoint.sh:/entrypoint.sh:ro
      - ../media:/app/media:ro
      - ../staticfiles:/app/staticfiles:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt:ro
      - webroot:/var/www/certbot
    entrypoint: /entrypoint.sh
    logging: *logging

networks:
  homeservice_network:
    name: homeservice_prod_network
volumes:
  certbot-etc:
  certbot-var:
  webroot:
