services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: homeservice_web_prod
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ../media:/app/media
      - ../staticfiles:/app/staticfiles
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - redis
      - db
    networks:
      - homeservice_network

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: homeservice_worker_prod
    restart: always
    volumes:
      - ../media:/app/media
      - ../staticfiles:/app/staticfiles
    entrypoint: /app/deploy/worker-entrypoint.sh
    command: python manage.py db_worker --queue-name default,notifications
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - redis
      - db
    networks:
      - homeservice_network

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: homeservice_db_prod
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-homeservice_user} -d ${DB_NAME:-homeservice}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./umami/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    environment:
      - POSTGRES_DB=${DB_NAME:-homeservice}
      - POSTGRES_USER=${DB_USER:-homeservice_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
    env_file:
      - ../.env
    networks:
      - homeservice_network

  redis:
    image: redis:alpine@sha256:ad0a6eff0a40304ab1ab4f50f0dc192d82b071e1094eac961bcb6106092f8a4e
    container_name: homeservice_redis_prod
    restart: always
    expose:
      - "6379"
    networks:
      - homeservice_network

  umami:
    image: ghcr.io/umami-software/umami@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123
    container_name: homeservice_umami
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-homeservice_user}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required}
      - TRACKER_SCRIPT_NAME=stats
    depends_on:
      - db
    expose:
      - "3000"
    networks:
      - homeservice_network

  dozzle:
    image: amir20/dozzle:v10.6.3@sha256:3d42f4c7b27f475117004f8524b52b6ea2cc1cdc39a508892d6b81ffb2883160
    container_name: homeservice_dozzle
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    secrets:
      - source: dozzle_users
        target: /data/users.yml
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
      - DOZZLE_ENABLE_ACTIONS=false
      - DOZZLE_NO_ANALYTICS=true
    env_file:
      - ../.env
    expose:
      - "8080"
    networks:
      - homeservice_network

  nginx:
    image: nginx@sha256:5aca99593157f4ae539a5dec1092a0ad8762f8e2eb1789085a13a0f5622369f6
    container_name: homeservice_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - umami
      - dozzle
    networks:
      - homeservice_network
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/entrypoint/entrypoint.sh:/entrypoint.sh:ro
      - ../media:/app/media:ro
      - ../staticfiles:/app/staticfiles:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt:ro
      - webroot:/var/www/certbot
    entrypoint: /entrypoint.sh
networks:
  homeservice_network:
    name: homeservice_prod_network

secrets:
  dozzle_users:
    file: ./dozzle/users.yml

volumes:
  postgres_data:
  certbot-etc:
  certbot-var:
  webroot:
  dozzle_data:
