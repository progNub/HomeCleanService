name: ${COMPOSE_PROJECT_NAME:-homeservice-prod}

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE must identify the built release image}
  env_file: ["${HOMESERVICE_ENV_FILE:-../.env}"]
  environment:
    DJANGO_SETTINGS_MODULE: settings.production
    DJANGO_LOAD_DOTENV: "0"
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
  networks: [homeservice_network]
  logging: *logging
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  web:
    <<: *app
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.parse,urllib.request; request=urllib.request.Request('http://localhost:8000/ready/', headers={'Host': urllib.parse.urlsplit(os.environ['SITE_URL']).netloc}); urllib.request.urlopen(request, timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 4
    volumes: ["../media:/app/media"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    restart: unless-stopped
    entrypoint: /app/deploy/worker-entrypoint.sh
    command: python manage.py db_worker --queue-name default,notifications
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  release:
    <<: *app
    profiles: [release]
    restart: "no"
    entrypoint: /app/deploy/release-entrypoint.sh
    volumes:
      - ../media:/app/media
      - ../staticfiles:/app/staticfiles
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./umami/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      POSTGRES_DB: ${DB_NAME:-homeservice}
      POSTGRES_USER: ${DB_USER:-homeservice_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    networks: [homeservice_network]
    logging: *logging

  redis:
    image: redis:alpine@sha256:ad0a6eff0a40304ab1ab4f50f0dc192d82b071e1094eac961bcb6106092f8a4e
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [homeservice_network]
    logging: *logging

  umami:
    image: ghcr.io/umami-software/umami@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-homeservice_user}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required}
      TRACKER_SCRIPT_NAME: stats
    depends_on:
      db: {condition: service_healthy}
    networks: [homeservice_network]
    logging: *logging

  dozzle:
    image: amir20/dozzle:v10.6.3@sha256:3d42f4c7b27f475117004f8524b52b6ea2cc1cdc39a508892d6b81ffb2883160
    profiles: [tools]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    secrets:
      - source: dozzle_users
        target: /data/users.yml
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_NO_ANALYTICS: "true"
    ports: ["127.0.0.1:8081:8080"]
    networks: [homeservice_network]
    logging: *logging

  nginx:
    image: nginx@sha256:5aca99593157f4ae539a5dec1092a0ad8762f8e2eb1789085a13a0f5622369f6
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    depends_on:
      web: {condition: service_healthy}
      umami: {condition: service_started}
    networks: [homeservice_network]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/entrypoint/entrypoint.sh:/entrypoint.sh:ro
      - ../media:/app/media:ro
      - ../staticfiles:/app/staticfiles:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt:ro
      - webroot:/var/www/certbot
    entrypoint: /entrypoint.sh
    logging: *logging

networks:
  homeservice_network:
    name: homeservice_prod_network
secrets:
  dozzle_users:
    file: ./dozzle/users.yml
volumes:
  postgres_data:
  certbot-etc:
  certbot-var:
  webroot:
  dozzle_data:
