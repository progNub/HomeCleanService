services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: homeservice_web_prod
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ../media:/app/media
      - static_volume:/app/staticfiles
    env_file:
      - ../.env
    depends_on:
      - redis
      - db

  db:
    image: postgres:16-alpine
    container_name: homeservice_db_prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-homeservice_user} -d ${DB_NAME:-homeservice}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-homeservice}
      - POSTGRES_USER=${DB_USER:-homeservice_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-homeservice_pass}
    env_file:
      - ../.env

  redis:
    image: redis:alpine
    container_name: homeservice_redis_prod
    restart: always
    expose:
      - "6379"

  nginx:
    image: nginx:latest
    container_name: homeservice_nginx_prod
    restart: always
    # TODO: If you use a different port on the server, change "80:80" to "YOUR_PORT:80"
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../media:/app/media:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  static_volume:
  postgres_data:
