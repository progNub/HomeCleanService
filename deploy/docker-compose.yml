services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: homeservice_web_prod
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ../media:/app/media
      - ../staticfiles:/app/staticfiles
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - redis
      - db

  db:
    image: postgres:16-alpine
    container_name: homeservice_db_prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-homeservice_user} -d ${DB_NAME:-homeservice}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./scripts/umami/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    environment:
      - POSTGRES_DB=${DB_NAME:-homeservice}
      - POSTGRES_USER=${DB_USER:-homeservice_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-homeservice_pass}
    env_file:
      - ../.env

  redis:
    image: redis:alpine
    container_name: homeservice_redis_prod
    restart: always
    expose:
      - "6379"

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: homeservice_umami
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-homeservice_user}:${DB_PASSWORD:-homeservice_pass}@db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:-replace-with-a-random-string}
      - TRACKER_SCRIPT_NAME=stats
    depends_on:
      - db
    ports:
      - "3000:3000"
  nginx:
    image: nginx:latest
    container_name: homeservice_nginx_prod
    restart: always
    # TODO: If you use a different port on the server, change "80:80" to "YOUR_PORT:80"
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../media:/app/media:ro
      - ../staticfiles:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
