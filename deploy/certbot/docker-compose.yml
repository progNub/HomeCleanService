services:
  certbot:
    image: certbot/certbot:v5.8.0
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    networks:
      - homeservice_network

volumes:
  certbot-etc:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-homeservice-prod}_certbot-etc
  certbot-var:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-homeservice-prod}_certbot-var
  webroot:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-homeservice-prod}_webroot

networks:
  homeservice_network:
    external: true
    name: homeservice_prod_network
